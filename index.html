<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>리포트 검토 · 내시경</title>
<style>
  /* ── 일관성 규칙 ───────────────────────────────────────────────
     색 2개  : --accent(AI 생성) · --edited(검토자 수정) + 중립 그레이
     글꼴 1개 : 시스템 산세리프
     간격 1개 : 8px 배수 (--s1 8 / --s2 16 / --s3 24)
  ───────────────────────────────────────────────────────────── */
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-2: #1d212a;
    --line: #272c37;
    --text: #e6e8ec;
    --muted: #8b93a1;
    --accent: #4a9eff;
    --edited: #f0b429;
    --s1: 8px; --s2: 16px; --s3: 24px;
    --r: 8px;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: flex; flex-direction: column;
    background: var(--bg); color: var(--text);
    font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button, input, select, textarea { font: inherit; color: inherit; }

  /* ── 상단 바: 여기가 뭘 하는 곳인지 ───────────────────────────── */
  .topbar {
    display: flex; align-items: center; gap: var(--s2);
    padding: 0 var(--s3); height: 56px;
    border-bottom: 1px solid var(--line); background: var(--panel);
  }
  .brand { font-size: 15px; font-weight: 600; letter-spacing: -.01em; }
  .ver {
    font-size: 11px; color: var(--muted);
    border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px;
  }
  .topbar select {
    background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 6px; padding: 5px 10px; font-size: 13px;
  }
  .meta { font-size: 12px; color: var(--muted); }
  .spacer { margin-left: auto; }
  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    border: 1px solid var(--line); border-radius: 999px;
    padding: 4px 12px; font-size: 12px; color: var(--muted);
  }
  .pill.on { border-color: #5a4a1f; background: #2a2210; color: var(--edited); }

  .tagline {
    margin: 0; padding: var(--s1) var(--s3);
    font-size: 13px; color: var(--muted);
    border-bottom: 1px solid var(--line); background: var(--panel);
  }

  /* ── 본문 2단 ────────────────────────────────────────────────── */
  main {
    flex: 1; min-height: 0;
    display: grid; grid-template-columns: 420px 1fr;
    gap: var(--s2); padding: var(--s2) var(--s3);
  }
  .panel {
    display: flex; flex-direction: column; min-height: 0;
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--r);
  }
  .panel-head {
    display: flex; align-items: center; gap: var(--s1);
    padding: var(--s1) var(--s2); border-bottom: 1px solid var(--line);
    min-height: 48px;
  }
  .panel-title { font-size: 13px; font-weight: 600; }
  .count { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }

  .tabs { display: inline-flex; gap: 4px; }
  .tabs button {
    border: 1px solid var(--line); background: transparent; color: var(--muted);
    border-radius: 999px; padding: 4px 11px; font-size: 12px; cursor: pointer;
  }
  .tabs button[aria-selected="true"] {
    border-color: var(--accent); color: var(--accent); background: #13263c;
  }

  .search {
    display: flex; align-items: center; gap: var(--s1);
    padding: var(--s1) var(--s2); border-bottom: 1px solid var(--line);
  }
  .search input {
    flex: 1; min-width: 0; background: var(--panel-2);
    border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; font-size: 13px;
  }
  .search input:focus { outline: none; border-color: var(--accent); }

  .scroll { flex: 1; min-height: 0; overflow: auto; padding: var(--s1) 0; }

  /* 전사문: 줄 단위로 끊어 탐색하기 쉽게 */
  .line { display: flex; gap: var(--s2); padding: 6px var(--s2); }
  .line .no {
    flex: none; width: 18px; text-align: right;
    font-size: 11px; color: #5c636f; font-variant-numeric: tabular-nums; padding-top: 2px;
  }
  .line p { margin: 0; }
  .line.hit { background: #1b2230; }
  .raw .line p { color: #b9c0cc; }
  mark { background: #3a3415; color: var(--edited); border-radius: 2px; padding: 0 2px; }

  /* ── 최종 리포트 ─────────────────────────────────────────────── */
  .legend { display: flex; gap: var(--s2); font-size: 11px; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
  .dot.ai { background: var(--accent); }
  .dot.ed { background: var(--edited); }

  .report { padding: var(--s2); display: grid; gap: var(--s2); }
  .field { display: grid; grid-template-columns: 92px 1fr; gap: var(--s2); align-items: start; }
  .field > .key {
    padding-top: 9px; font-size: 13px; color: var(--muted);
    display: flex; align-items: center; gap: 6px; white-space: nowrap;
  }
  .field textarea {
    width: 100%; resize: vertical; background: var(--panel-2);
    border: 1px solid var(--line); border-left: 2px solid var(--accent);
    border-radius: 6px; padding: 8px 11px; font-size: 13.5px; line-height: 1.7;
  }
  .field textarea:focus { outline: none; border-color: var(--accent); }
  .field.edited textarea { border-left-color: var(--edited); }
  .field.empty textarea { border-left-color: #5c636f; }
  .field textarea::placeholder { color: #5c636f; }
  .hint { grid-column: 2; font-size: 11px; color: var(--muted); margin: -6px 0 0; }
  .hint.warn { color: var(--edited); }
  details { grid-column: 2; font-size: 11px; color: var(--muted); margin-top: -6px; }
  details summary { cursor: pointer; list-style: none; }
  details summary::before { content: "▸ "; }
  details[open] summary::before { content: "▾ "; }
  details p {
    margin: 6px 0 0; padding: 8px 11px; background: var(--panel-2);
    border-radius: 6px; white-space: pre-wrap; color: #b9c0cc;
  }

  /* ── 로딩 / 빈 상태 ──────────────────────────────────────────── */
  .skel { padding: var(--s2); display: grid; gap: 10px; }
  .skel i {
    display: block; height: 11px; border-radius: 4px; background: var(--panel-2);
    animation: pulse 1.1s ease-in-out infinite;
  }
  @keyframes pulse { 50% { opacity: .45; } }
  .blank {
    margin: var(--s2); padding: var(--s3); border-radius: var(--r);
    border: 1px dashed var(--line); text-align: center;
    font-size: 12.5px; color: var(--muted);
  }
  .blank b { display: block; color: var(--text); font-size: 13px; margin-bottom: 4px; font-weight: 600; }

  /* ── 하단 바: 핵심 행동 하나 ─────────────────────────────────── */
  .bottombar {
    display: flex; align-items: center; gap: var(--s2);
    padding: 0 var(--s3); height: 64px;
    border-top: 1px solid var(--line); background: var(--panel);
  }
  .note { font-size: 13px; color: var(--muted); }
  .note.block { color: var(--edited); }
  .primary {
    margin-left: auto; border: 0; border-radius: var(--r);
    background: var(--accent); color: #07121f;
    padding: 11px 20px; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .primary:disabled { background: #2a2f3a; color: #5c636f; cursor: not-allowed; }
</style>
</head>
<body>

<header class="topbar">
  <span class="brand">리포트 검토</span>
  <span class="ver">V1</span>
  <select id="caseSelect" aria-label="검토할 케이스"></select>
  <span class="meta" id="versionMeta"></span>
  <span class="spacer"></span>
  <span class="pill" id="statusPill">수정 0건</span>
</header>

<p class="tagline">음성 전사문과 AI 리포트 초안을 나란히 확인하고, 수정한 뒤 JSON으로 내보냅니다.</p>

<main>
  <!-- 좌: 전사문 -->
  <section class="panel">
    <div class="panel-head">
      <span class="panel-title">음성 전사문</span>
      <span class="spacer"></span>
      <div class="tabs" id="tabs">
        <button data-tab="raw">원문</button>
        <button data-tab="corrected" aria-selected="true">의학용어 후보정</button>
      </div>
    </div>
    <div class="search">
      <input id="search" placeholder="전사문에서 찾기 (예: 전정부)" />
      <span class="count" id="matchCount"></span>
    </div>
    <div class="scroll" id="transcript"></div>
  </section>

  <!-- 우: 최종 리포트 -->
  <section class="panel">
    <div class="panel-head">
      <span class="panel-title">최종 리포트</span>
      <span class="count" id="filled"></span>
      <span class="spacer"></span>
      <div class="legend">
        <span><i class="dot ai"></i>AI 생성</span>
        <span><i class="dot ed"></i>검토자 수정</span>
      </div>
    </div>
    <div class="scroll" id="report"></div>
  </section>
</main>

<footer class="bottombar">
  <span class="note" id="footNote"></span>
  <button class="primary" id="exportBtn">리포트 내보내기</button>
</footer>

<script>
/* 가상 샘플 — 실제 환자 기록 아님. 기업 샘플 받으면 교체 */
const CASES = [
  {
    case_id: "EGD-2026-0001",
    model_version: "report-draft-1.2.0",
    prompt_version: "egd-v3",
    raw_text:
      "어 네 시작합니다 식도는 전반적으로 깨끗하고 점막 변화 없습니다\n" +
      "위 들어가서 전정부 쪽에 삼에서 사 밀리 얕은 궤양 하나 있고 주변에 발적 있습니다\n" +
      "체부는 특이 소견 없고 분문부 미란은 없습니다 없습니다 이거 꼭 넣어주세요\n" +
      "십이지장 하행부까지 봤고 구부 궤양 없습니다 정상입니다\n" +
      "전정부 궤양 외에는 유의한 소견 없고 추적 관찰 권고로 정리해주세요 종료합니다",
    corrected_text:
      "식도는 전반적으로 깨끗하고 점막 변화 없습니다.\n" +
      "위 전정부(antrum)에 3~4mm 얕은 궤양 1개, 주변 발적(erythema) 동반.\n" +
      "체부(body) 특이 소견 없고, 분문부(cardia) 미란(erosion)은 없습니다.\n" +
      "십이지장 하행부까지 관찰, 구부(bulb) 궤양 없이 정상.\n" +
      "전정부 궤양 외 유의한 소견 없으며 추적 관찰 권고.",
    report: {
      esophagus: "전 구간 점막 변화 없음. 정상.",
      stomach: "전정부에 3~4mm 얕은 궤양 1개, 주변 발적 동반. 체부·분문부 특이 소견 없음.",
      duodenum: "구부 및 하행부 정상.",
      findings: "전정부 얕은 궤양 (3~4mm)\n주변 점막 발적\n추적 관찰 권고"
    }
  },
  {
    case_id: "EGD-2026-0002",
    model_version: "report-draft-1.2.0",
    prompt_version: "egd-v3",
    raw_text:
      "네 식도 상부부터 봅니다 특이 소견 없습니다\n" +
      "위 체부에 반상 발적 몇 개 보입니다\n" +
      "어 십이지장은 기록 누락됐네요 종료합니다",
    corrected_text:
      "식도 상부부터 관찰, 특이 소견 없습니다.\n" +
      "위 체부(body)에 반상 발적 수 개 관찰.\n" +
      "십이지장 기록 누락.",
    report: { esophagus: "특이 소견 없음.", stomach: "체부에 반상 발적 수 개.", duodenum: "", findings: "" }
  },
  {
    case_id: "EGD-2026-0003",
    model_version: "report-draft-1.2.0",
    prompt_version: "egd-v3",
    raw_text: "",
    corrected_text: "",
    report: { esophagus: "", stomach: "", duodenum: "", findings: "" }
  }
];

const FIELDS = [
  { key: "esophagus", label: "식도", required: true, rows: 2 },
  { key: "stomach",   label: "위",   required: true, rows: 3 },
  { key: "duodenum",  label: "십이지장", required: true, rows: 2 },
  { key: "findings",  label: "주요 소견", required: false, rows: 4,
    placeholder: "한 줄에 하나씩 입력" }
];

/* 상태: 원본(CASES)은 손대지 않고 수정본만 drafts에 보관 */
const drafts = CASES.map(c => ({ ...c.report }));
let idx = 0, tab = "corrected", query = "", loading = false;

const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>]/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[m]));
const skel = n => '<div class="skel">' + '<i></i>'.repeat(n) + "</div>";

/* ── 전사문 ─────────────────────────────────────────────────── */
function renderTranscript() {
  const box = $("transcript");
  if (loading) { box.innerHTML = skel(7); $("matchCount").textContent = ""; return; }

  const c = CASES[idx];
  const text = tab === "raw" ? c.raw_text : c.corrected_text;
  box.className = "scroll" + (tab === "raw" ? " raw" : "");

  if (!text.trim()) {
    box.innerHTML =
      '<div class="blank"><b>전사문이 없습니다</b>' +
      (tab === "raw"
        ? "이 케이스에는 음성 전사 원문이 없습니다. 샘플 데이터를 확인해 주세요."
        : "후보정 결과가 없습니다. 원문 탭에서 발화 내용을 확인해 보세요.") +
      "</div>";
    $("matchCount").textContent = "";
    return;
  }

  const q = query.trim();
  const re = q ? new RegExp("(" + q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "gi") : null;
  let hits = 0;

  box.innerHTML = text.split("\n").map((line, i) => {
    let html = esc(line), hit = false;
    if (re) {
      const parts = line.split(re);
      hit = parts.length > 1;
      if (hit) hits += (parts.length - 1) / 2;
      html = parts
        .map(p => (q && p.toLowerCase() === q.toLowerCase() ? "<mark>" + esc(p) + "</mark>" : esc(p)))
        .join("");
    }
    return `<div class="line${hit ? " hit" : ""}"><span class="no">${i + 1}</span><p>${html}</p></div>`;
  }).join("");

  $("matchCount").textContent = q ? (hits ? hits + "건 일치" : "일치 없음") : "";
}

/* ── 리포트 ─────────────────────────────────────────────────── */
function renderReport() {
  const box = $("report");
  if (loading) { box.innerHTML = skel(10); return; }

  const c = CASES[idx], d = drafts[idx];

  box.innerHTML = '<div class="report">' + FIELDS.map(f => {
    const changed = d[f.key] !== c.report[f.key];
    const blank = !d[f.key].trim();
    const cls = "field" + (changed ? " edited" : blank ? " empty" : "");
    return `
      <div class="${cls}">
        <span class="key"><i class="dot ${changed ? "ed" : "ai"}"></i>${f.label}</span>
        <textarea id="f-${f.key}" data-key="${f.key}" rows="${f.rows}"
          placeholder="${f.placeholder || (f.required ? "필수 입력" : "")}">${esc(d[f.key])}</textarea>
        ${
          blank && f.required
            ? '<p class="hint warn">AI가 생성하지 못한 항목입니다. 직접 입력해야 내보낼 수 있습니다.</p>'
            : ""
        }
        ${
          changed
            ? `<details><summary>AI 최초 생성값</summary><p>${esc(c.report[f.key] || "(생성값 없음)")}</p></details>`
            : ""
        }
      </div>`;
  }).join("") + "</div>";

  box.querySelectorAll("textarea").forEach(ta => {
    ta.addEventListener("input", e => {
      drafts[idx][e.target.dataset.key] = e.target.value;
      renderStatus();
    });
    ta.addEventListener("blur", renderReport);
  });
}

/* ── 상태 문구 ──────────────────────────────────────────────── */
function renderStatus() {
  const c = CASES[idx], d = drafts[idx];
  const changed = FIELDS.filter(f => d[f.key] !== c.report[f.key]);
  const required = FIELDS.filter(f => f.required);
  const missing = required.filter(f => !d[f.key].trim());

  $("versionMeta").textContent = loading ? "" : c.model_version + " · " + c.prompt_version;
  $("filled").textContent = loading
    ? ""
    : `필수 ${required.length - missing.length}/${required.length}`;

  const pill = $("statusPill");
  pill.textContent = "수정 " + changed.length + "건";
  pill.classList.toggle("on", changed.length > 0);

  const note = $("footNote");
  if (loading) {
    note.textContent = "케이스를 불러오는 중입니다…";
    note.className = "note";
  } else if (missing.length) {
    note.textContent = "필수 항목 " + missing.length + "개가 비어 있습니다 — " +
      missing.map(f => f.label).join(", ");
    note.className = "note block";
  } else {
    note.textContent = "검토 완료 준비됨 · 수정 " + changed.length + "건";
    note.className = "note";
  }
  $("exportBtn").disabled = loading || missing.length > 0;
}

/* ── 내보내기 ───────────────────────────────────────────────── */
function exportJson() {
  const c = CASES[idx], d = drafts[idx];
  const report = {};
  FIELDS.forEach(f => {
    report[f.key] = {
      original: c.report[f.key],
      edited: d[f.key],
      is_modified: c.report[f.key] !== d[f.key]
    };
  });
  const payload = {
    case_id: c.case_id,
    meta: {
      model_version: c.model_version,
      prompt_version: c.prompt_version,
      exported_at: new Date().toISOString()
    },
    transcript: { raw_text: c.raw_text, corrected_text: c.corrected_text },
    report,
    review_status: "completed"
  };
  const url = URL.createObjectURL(
    new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" })
  );
  const a = document.createElement("a");
  a.href = url;
  a.download = c.case_id + "_review.json";
  a.click();
  URL.revokeObjectURL(url);
}

/* ── 초기화 ─────────────────────────────────────────────────── */
function renderAll() { renderTranscript(); renderReport(); renderStatus(); }

function loadCase(next) {
  idx = next;
  query = "";
  $("search").value = "";
  loading = true;
  renderAll();
  setTimeout(() => { loading = false; renderAll(); }, 320);
}

$("caseSelect").innerHTML = CASES.map((c, i) => `<option value="${i}">${c.case_id}</option>`).join("");
$("caseSelect").addEventListener("change", e => loadCase(+e.target.value));
$("tabs").addEventListener("click", e => {
  const btn = e.target.closest("button[data-tab]");
  if (!btn) return;
  tab = btn.dataset.tab;
  [...$("tabs").children].forEach(b => b.setAttribute("aria-selected", b === btn));
  renderTranscript();
});
$("search").addEventListener("input", e => { query = e.target.value; renderTranscript(); });
$("exportBtn").addEventListener("click", exportJson);

loadCase(0);
</script>
</body>
</html>
