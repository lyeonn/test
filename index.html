<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>내시경 리포트 검토</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 20px;
    background: #f4f5f7; color: #16181d;
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", system-ui, sans-serif;
  }
  .wrap { max-width: 1100px; margin: 0 auto; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 12px; }
  h1 { font-size: 16px; margin: 0; }
  .meta { font-size: 12px; color: #6b7280; }
  .spacer { margin-left: auto; }
  select, input, textarea, button { font: inherit; }
  select, input, textarea {
    border: 1px solid #e3e5ea; border-radius: 6px; padding: 6px 9px; background: #fff;
  }
  input:focus, textarea:focus { outline: none; border-color: #1f5fd0; }
  button.primary {
    background: #1f5fd0; color: #fff; border: 0; border-radius: 6px;
    padding: 7px 13px; font-size: 13px; font-weight: 500; cursor: pointer;
  }
  button.primary:disabled { opacity: .4; cursor: not-allowed; }
  .warn {
    background: #fffbeb; border: 1px solid #fde68a; color: #92400e;
    border-radius: 6px; padding: 8px 11px; font-size: 12px; margin-bottom: 12px;
  }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: start; }
  @media (max-width: 820px) { .cols { grid-template-columns: 1fr; } }
  .panel { background: #fff; border: 1px solid #e3e5ea; border-radius: 8px; }
  .panel-head { display: flex; gap: 8px; align-items: center; padding: 10px; border-bottom: 1px solid #e3e5ea; }
  .tabs { display: inline-flex; background: #f1f2f4; border-radius: 6px; padding: 2px; }
  .tabs button {
    border: 0; background: none; border-radius: 4px; padding: 4px 10px;
    font-size: 12px; color: #6b7280; cursor: pointer;
  }
  .tabs button[aria-selected="true"] { background: #fff; color: #16181d; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .panel-head input { flex: 1; min-width: 0; font-size: 13px; }
  .count { font-size: 11px; color: #6b7280; white-space: nowrap; }
  #transcript {
    padding: 14px; white-space: pre-wrap; line-height: 1.85;
    max-height: 62vh; overflow: auto; border-left: 3px solid #1f5fd0;
  }
  #transcript.raw {
    border-left-color: #94a3b8; background: #f8fafc;
    font-family: ui-monospace, Menlo, monospace; font-size: 12.5px;
  }
  mark { background: #fde68a; border-radius: 2px; }
  .empty { margin: 16px; padding: 24px; text-align: center; font-size: 12px; color: #6b7280; background: #f8fafc; border-radius: 6px; }
  .report { padding: 14px; display: grid; gap: 14px; }
  .field label { font-size: 13px; font-weight: 500; }
  .field .row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .req { color: #dc2626; }
  .tag {
    font-size: 11px; padding: 1px 8px; border-radius: 999px;
    background: #fef3c7; border: 1px solid #fcd34d; color: #92400e;
  }
  textarea { width: 100%; resize: vertical; font-size: 13px; line-height: 1.6; }
  textarea.missing { border-color: #f59e0b; background: #fffbeb; }
  details { font-size: 11px; color: #6b7280; margin-top: 5px; }
  details summary { cursor: pointer; }
  details p { margin: 5px 0 0; padding: 8px; background: #f8fafc; border-radius: 4px; white-space: pre-wrap; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>내시경 리포트 검토</h1>
    <select id="caseSelect"></select>
    <span class="meta" id="versionMeta"></span>
    <span class="meta spacer" id="modifiedCount"></span>
    <button class="primary" id="exportBtn">JSON 내보내기</button>
  </header>

  <div class="warn" id="warnBox" hidden></div>

  <div class="cols">
    <section class="panel">
      <div class="panel-head">
        <div class="tabs" id="tabs">
          <button data-tab="raw">음성 전사 원문</button>
          <button data-tab="corrected" aria-selected="true">의학용어 후보정</button>
        </div>
        <input id="search" placeholder="전사문 검색" />
        <span class="count" id="matchCount"></span>
      </div>
      <div id="transcript"></div>
    </section>

    <section class="panel">
      <div class="report" id="report"></div>
    </section>
  </div>
</div>

<script>
/* 가상 샘플 — 실제 환자 기록 아님. 기업 샘플 받으면 교체 */
const CASES = [
  {
    case_id: "EGD-2026-0001",
    model_version: "report-draft-1.2.0",
    prompt_version: "egd-v3",
    raw_text:
      "어 네 시작합니다 식도는 전반적으로 깨끗하고 점막 변화 없습니다\n" +
      "위 들어가서 전정부 쪽에 삼에서 사 밀리 얕은 궤양 하나 있고 주변에 발적 있습니다\n" +
      "체부는 특이 소견 없고 분문부 미란은 없습니다 없습니다 이거 꼭 넣어주세요\n" +
      "십이지장 하행부까지 봤고 구부 궤양 없습니다 정상입니다\n" +
      "전정부 궤양 외에는 유의한 소견 없고 추적 관찰 권고로 정리해주세요 종료합니다",
    corrected_text:
      "식도는 전반적으로 깨끗하고 점막 변화 없습니다.\n" +
      "위 전정부(antrum)에 3~4mm 얕은 궤양 1개, 주변 발적(erythema) 동반.\n" +
      "체부(body) 특이 소견 없고, 분문부(cardia) 미란(erosion)은 없습니다.\n" +
      "십이지장 하행부까지 관찰, 구부(bulb) 궤양 없이 정상.\n" +
      "전정부 궤양 외 유의한 소견 없으며 추적 관찰 권고.",
    report: {
      esophagus: "전 구간 점막 변화 없음. 정상.",
      stomach: "전정부에 3~4mm 얕은 궤양 1개, 주변 발적 동반. 체부·분문부 특이 소견 없음.",
      duodenum: "구부 및 하행부 정상.",
      findings: "전정부 얕은 궤양 (3~4mm)\n주변 점막 발적\n추적 관찰 권고"
    }
  },
  {
    case_id: "EGD-2026-0002",
    model_version: "report-draft-1.2.0",
    prompt_version: "egd-v3",
    raw_text:
      "네 식도 상부부터 봅니다 특이 소견 없습니다\n" +
      "위 체부에 반상 발적 몇 개 보입니다\n" +
      "어 십이지장은 기록 누락됐네요 종료합니다",
    corrected_text:
      "식도 상부부터 관찰, 특이 소견 없습니다.\n" +
      "위 체부(body)에 반상 발적 수 개 관찰.\n" +
      "십이지장 기록 누락.",
    report: { esophagus: "특이 소견 없음.", stomach: "체부에 반상 발적 수 개.", duodenum: "", findings: "" }
  }
];

const FIELDS = [
  { key: "esophagus", label: "식도", required: true },
  { key: "stomach", label: "위", required: true },
  { key: "duodenum", label: "십이지장", required: true },
  { key: "findings", label: "주요 소견 (한 줄에 하나)", required: false }
];

/* 상태: 원본(CASES)은 손대지 않고 수정본만 drafts에 보관 */
const drafts = CASES.map(c => ({ ...c.report }));
let idx = 0, tab = "corrected", query = "";

const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>]/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[m]));

function renderTranscript() {
  const c = CASES[idx];
  const text = tab === "raw" ? c.raw_text : c.corrected_text;
  const box = $("transcript");
  box.className = tab === "raw" ? "raw" : "";

  if (!text.trim()) {
    box.innerHTML = '<p class="empty">전사문이 비어 있습니다.</p>';
    $("matchCount").textContent = "";
    return;
  }

  const q = query.trim();
  if (!q) {
    box.innerHTML = esc(text);
    $("matchCount").textContent = "";
    return;
  }
  const parts = text.split(new RegExp("(" + q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "gi"));
  box.innerHTML = parts
    .map(p => (p.toLowerCase() === q.toLowerCase() ? "<mark>" + esc(p) + "</mark>" : esc(p)))
    .join("");
  const hits = box.querySelectorAll("mark").length;
  $("matchCount").textContent = hits ? hits + "건" : "일치 없음";
}

function renderReport() {
  const c = CASES[idx], d = drafts[idx];
  $("report").innerHTML = FIELDS.map(f => {
    const changed = d[f.key] !== c.report[f.key];
    const missing = f.required && !d[f.key].trim();
    return `
      <div class="field">
        <div class="row">
          <label for="f-${f.key}">${f.label}${f.required ? ' <span class="req">*</span>' : ""}</label>
          ${changed ? '<span class="tag">수정됨</span>' : ""}
        </div>
        <textarea id="f-${f.key}" data-key="${f.key}" rows="${f.key === "findings" ? 4 : 2}"
          class="${missing ? "missing" : ""}">${esc(d[f.key])}</textarea>
        ${changed ? `<details><summary>AI 최초 생성값 보기</summary><p>${esc(c.report[f.key] || "(없음)")}</p></details>` : ""}
      </div>`;
  }).join("");

  $("report").querySelectorAll("textarea").forEach(ta => {
    ta.addEventListener("input", e => {
      drafts[idx][e.target.dataset.key] = e.target.value;
      renderStatus();
    });
    ta.addEventListener("blur", renderReport);
  });
}

function renderStatus() {
  const c = CASES[idx], d = drafts[idx];
  const changed = FIELDS.filter(f => d[f.key] !== c.report[f.key]);
  const missing = FIELDS.filter(f => f.required && !d[f.key].trim());

  $("versionMeta").textContent = c.model_version + " · " + c.prompt_version;
  $("modifiedCount").textContent = "수정 " + changed.length + "건";
  $("exportBtn").disabled = missing.length > 0;
  $("warnBox").hidden = missing.length === 0;
  if (missing.length) {
    $("warnBox").textContent =
      "필수 항목 누락: " + missing.map(f => f.label).join(", ") + " — 입력하면 내보낼 수 있습니다.";
  }
}

function exportJson() {
  const c = CASES[idx], d = drafts[idx];
  const report = {};
  FIELDS.forEach(f => {
    report[f.key] = {
      original: c.report[f.key],
      edited: d[f.key],
      is_modified: c.report[f.key] !== d[f.key]
    };
  });
  const payload = {
    case_id: c.case_id,
    meta: {
      model_version: c.model_version,
      prompt_version: c.prompt_version,
      exported_at: new Date().toISOString()
    },
    transcript: { raw_text: c.raw_text, corrected_text: c.corrected_text },
    report,
    review_status: "completed"
  };
  const url = URL.createObjectURL(new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" }));
  const a = document.createElement("a");
  a.href = url;
  a.download = c.case_id + "_review.json";
  a.click();
  URL.revokeObjectURL(url);
}

/* 초기화 */
$("caseSelect").innerHTML = CASES.map((c, i) => `<option value="${i}">${c.case_id}</option>`).join("");
$("caseSelect").addEventListener("change", e => {
  idx = +e.target.value;
  query = "";
  $("search").value = "";
  renderAll();
});
$("tabs").addEventListener("click", e => {
  const btn = e.target.closest("button[data-tab]");
  if (!btn) return;
  tab = btn.dataset.tab;
  [...$("tabs").children].forEach(b => b.setAttribute("aria-selected", b === btn));
  renderTranscript();
});
$("search").addEventListener("input", e => { query = e.target.value; renderTranscript(); });
$("exportBtn").addEventListener("click", exportJson);

function renderAll() { renderTranscript(); renderReport(); renderStatus(); }
renderAll();
</script>
</body>
</html>
